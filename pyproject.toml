[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tensorcad"
version = "0.1.0"
description = "Agent-callable parametric geometry foundation for the Tensor scientific-computing ecosystem"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "TensorCAD contributors" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
tensorcad-hull = "tensorcad.cli:main"

[tool.setuptools.packages.find]
include = ["tensorcad*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
