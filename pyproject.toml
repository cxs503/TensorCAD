[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tensorcad"
version = "0.6.0"
description = "Agent-callable parametric geometry foundation for the Tensor scientific-computing ecosystem"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "TensorCAD contributors" }]
keywords = ["geometry", "cad", "parametric", "hydrostatics", "agents", "reproducibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
]
# The core package must install with nothing but the standard library: an agent
# generating geometry in a constrained environment should never need a CAD kernel.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7", "numpy>=1.24"]
dev = ["ruff>=0.6", "mypy>=1.8", "pytest-cov>=4"]
# Research-only neural field training and non-executable tensor checkpoints.
neural = ["torch>=2.2", "safetensors>=0.4", "numpy>=1.24"]
# Optional solver/kernel bridges (tensorcad.adapters) land here, e.g. "ocp>=7",
# "gmsh". Nothing in the core may import them.

[project.urls]
Homepage = "https://github.com/cxs503/TensorCAD"
Issues = "https://github.com/cxs503/TensorCAD/issues"

[project.scripts]
tensorcad-hull = "tensorcad.cli:main"
tensorcad-neural = "tensorcad.cli_neural:main"

[tool.setuptools.packages.find]
include = ["tensorcad*"]

[tool.setuptools.package-data]
tensorcad = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
  "E741",  # single-letter names are fine in short numeric loops
  "RUF001",  # the docstrings use typographic dashes/quotes deliberately
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Example scripts prepend the checkout to sys.path before importing tensorcad,
# so import-order rules do not apply to them.
"examples/*" = ["E501", "E402", "I001"]

[tool.mypy]
python_version = "3.10"
packages = ["tensorcad"]
strict = true
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
# Treat the optional torch/safetensors stack as untyped whether or not it is
# installed, so `mypy` gives the same answer in the torch-free CI job and in an
# environment with the `neural` extra. The alternative -- different results per
# machine -- made the type check environment-dependent.
module = ["torch", "torch.*", "safetensors", "safetensors.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.coverage.run]
source = ["tensorcad"]
branch = true
# These modules import torch (or, for the CLI, call into it), so they cannot even
# be imported without the `neural` extra that the default test job does not
# install. They are measured by the neural-geometry-experiments workflow, which
# installs the extra and runs its own coverage gate.
omit = [
  "tensorcad/neural/field.py",
  "tensorcad/neural/objects.py",
  "tensorcad/cli_neural.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
