name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: pytest
      - run: tensorcad-hull --output /tmp/tensorcad-hull
      - run: test -s /tmp/tensorcad-hull/hull.obj && test -s /tmp/tensorcad-hull/offsets.csv && test -s /tmp/tensorcad-hull/metadata.json
