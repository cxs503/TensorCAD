name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test,dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Tests with coverage gate
        # The torch-backed neural modules are excluded here (the `neural` extra is
        # not installed) and measured by the neural-geometry-experiments workflow.
        run: pytest --cov --cov-report=term-missing
      - name: Neural CLI help (no torch required)
        run: tensorcad-neural --help

      - name: CLI artifacts
        run: |
          tensorcad-hull --output /tmp/tensorcad-hull
          test -s /tmp/tensorcad-hull/hull.obj
          test -s /tmp/tensorcad-hull/offsets.csv
          test -s /tmp/tensorcad-hull/metadata.json
      - name: Reproducibility (same parameters, same bytes)
        run: |
          tensorcad-hull --nx 21 --nz 9 --output /tmp/run-a > /dev/null
          tensorcad-hull --nx 21 --nz 9 --output /tmp/run-b > /dev/null
          cmp /tmp/run-a/hull.obj /tmp/run-b/hull.obj
          cmp /tmp/run-a/metadata.json /tmp/run-b/metadata.json
      - name: Geometry benchmark (measured verification, no mocks)
        run: python examples/parametric_hull/run_example.py --output /tmp/tensorcad-example
      - name: Continuous geometry core benchmark (analytic fields only without torch)
        run: python examples/geometry_core/run_benchmark.py --resolution 40 --points 5000
      - name: SUBOFF bare hull (measured field, edits and export)
        run: python examples/suboff/run_example.py --output /tmp/tensorcad-suboff
      - name: SUBOFF export artifacts
        run: |
          test -s /tmp/tensorcad-suboff/suboff_bare_hull.obj
          test -s /tmp/tensorcad-suboff/suboff_bare_hull.stl
          test -s /tmp/tensorcad-suboff/handoff.json
      - name: SUBOFF appendages (AFF-8 sail, fins and the full union)
        run: python examples/suboff_appendages/run_example.py --coarse 218,26,38 --fine 320,38,56 --output /tmp/tensorcad-aff8
      - name: SUBOFF appendage export artifacts
        run: |
          test -s /tmp/tensorcad-aff8/suboff_full_model.obj
          test -s /tmp/tensorcad-aff8/suboff_full_model.stl
          test -s /tmp/tensorcad-aff8/suboff_sail.obj
          test -s /tmp/tensorcad-aff8/suboff_fins.obj
          test -s /tmp/tensorcad-aff8/handoff.json
          test -s /tmp/tensorcad-aff8/field.json
      - name: Mesh conditioning (sliver removal, drift, decimation)
        # The projection step dominates; 15,000 faces keeps the job at ~30 s while
        # still going through every stage of the pipeline.
        run: python examples/mesh_conditioning/run_example.py --resolution 110,14,20 --targets 30000,20000 --output /tmp/tensorcad-conditioning
      - name: Mesh conditioning artifacts
        run: |
          test -s /tmp/tensorcad-conditioning/aff8_conditioned.obj
          test -s /tmp/tensorcad-conditioning/aff8_conditioned.msh
          test -s /tmp/tensorcad-conditioning/aff8_conditioned.json
          test -s /tmp/tensorcad-conditioning/conditioning.json
      - name: FEM handoff and STEP export (STEP part needs the optional OCP extra)
        run: python examples/step_export/run_example.py --resolution 60,8,11 --output /tmp/tensorcad-step
      - name: FEM handoff artifacts
        run: |
          test -s /tmp/tensorcad-step/aff8_surface.msh
          test -s /tmp/tensorcad-step/aff8_surface.json
      - name: Design loop (target -> verified hull -> solver manifest)
        run: python examples/design_loop/run_example.py --output /tmp/tensorcad-design
      - name: Design loop artifacts
        run: |
          test -s /tmp/tensorcad-design/design_hull.obj
          test -s /tmp/tensorcad-design/design_hull.msh
          test -s /tmp/tensorcad-design/solver_manifest.json
          test -s /tmp/tensorcad-design/design_path.json
      - name: Representation benchmark (analytic, mesh, neural, STEP in one harness)
        # Every row is measured against the same rays and the same closed form; rows whose
        # extra is not installed (torch, OCP) must report not_supported rather than a zero,
        # and the command's exit code is the verdict, so a red gate fails this job.
        run: python examples/benchmarks/run_benchmark.py --quick --output /tmp/tensorcad-benchmark
      - name: Representation benchmark artifacts
        run: |
          test -s /tmp/tensorcad-benchmark/results.json
          test -s /tmp/tensorcad-benchmark/report.md
          python -c "import json,sys; d=json.load(open('/tmp/tensorcad-benchmark/results.json')); \
            assert d['passed'] is True, d['failures']; \
            assert d['schema'] == 'tensorcad.benchmark/1'; \
            rows={r['identifier'] for c in d['cases'] for r in c['representations']}; \
            assert {'analytic_field','mesh_local_edit','parametric_hull'} <= rows, rows"

      - name: Example artifacts
        run: test -s /tmp/tensorcad-example/hull.obj
